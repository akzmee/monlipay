# =============================================================================
# docker-compose.yml — MonliPay dual deployment (testnet + mainnet) + indexer
# =============================================================================

services:
  # ---------------------------------------------------------------
  # PONDER INDEXER — indexes LinkVault events, serves API on :42069
  # ---------------------------------------------------------------
  indexer:
    container_name: monlipay-indexer
    build:
      context: ./indexer
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:42068:42069"
    restart: unless-stopped
    environment:
      DATABASE_SCHEMA: monlipay
      PORT: "42069"
      PONDER_MONAD_MAINNET_VAULT: ${MAINNET_LINK_VAULT_ADDRESS}
      PONDER_MONAD_TESTNET_VAULT: ${TESTNET_LINK_VAULT_ADDRESS:-}
      PONDER_RPC_MAINNET: https://monad-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}
      PONDER_RPC_TESTNET: https://testnet-rpc.monad.xyz
    networks:
      - monlipay

  # ---------------------------------------------------------------
  # TESTNET — chain ID 10143
  # ---------------------------------------------------------------
  monlipay-testnet:
    container_name: monlipay-testnet
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_NETWORK: testnet
        NEXT_PUBLIC_LINK_VAULT_ADDRESS: ${TESTNET_LINK_VAULT_ADDRESS}
        NEXT_PUBLIC_WC_PROJECT_ID: ${NEXT_PUBLIC_WC_PROJECT_ID}
        NEXT_PUBLIC_GAS_SPONSOR_ENABLED: "true"
        NEXT_PUBLIC_GAS_FORWARDER_ADDRESS: ${NEXT_PUBLIC_GAS_FORWARDER_ADDRESS:-}
    ports:
      - "0.0.0.0:3100:3000"
    restart: unless-stopped
    depends_on:
      - indexer
    environment:
      LIFI_API_KEY: ${LIFI_API_KEY:-}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      GAS_SPONSOR_PRIVATE_KEY: ${GAS_SPONSOR_PRIVATE_KEY:-}
      GAS_SPONSOR_DAILY_BUDGET_MON: ${GAS_SPONSOR_DAILY_BUDGET_MON:-5}
      INDEXER_INTERNAL_URL: http://indexer:42069
    networks:
      - monlipay

  # ---------------------------------------------------------------
  # MAINNET — chain ID 143
  # ---------------------------------------------------------------
  monlipay-mainnet:
    container_name: monlipay-mainnet
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_NETWORK: mainnet
        NEXT_PUBLIC_LINK_VAULT_ADDRESS: ${MAINNET_LINK_VAULT_ADDRESS}
        NEXT_PUBLIC_WC_PROJECT_ID: ${NEXT_PUBLIC_WC_PROJECT_ID}
        NEXT_PUBLIC_GAS_SPONSOR_ENABLED: "true"
        NEXT_PUBLIC_GAS_FORWARDER_ADDRESS: ${NEXT_PUBLIC_GAS_FORWARDER_ADDRESS:-}
    ports:
      - "0.0.0.0:4100:3000"
    restart: unless-stopped
    depends_on:
      - indexer
    environment:
      LIFI_API_KEY: ${LIFI_API_KEY:-}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      GAS_SPONSOR_PRIVATE_KEY: ${GAS_SPONSOR_PRIVATE_KEY:-}
      GAS_SPONSOR_DAILY_BUDGET_MON: ${GAS_SPONSOR_DAILY_BUDGET_MON:-5}
      INDEXER_INTERNAL_URL: http://indexer:42069
    networks:
      - monlipay

networks:
  monlipay:
    driver: bridge
