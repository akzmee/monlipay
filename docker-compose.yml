# =============================================================================
# docker-compose.yml — MonliPay dual deployment (testnet + mainnet) + indexer
# =============================================================================

services:
  # ---------------------------------------------------------------
  # PONDER INDEXER — indexes LinkVault events, serves API on :42069
  # ---------------------------------------------------------------
  indexer:
    container_name: monlipay-indexer
    build:
      context: ./indexer
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:42068:42069"
    restart: unless-stopped
    environment:
      DATABASE_SCHEMA: ${PONDER_DATABASE_SCHEMA:-monlipay}
      PORT: "42069"
      PONDER_MONAD_MAINNET_VAULT: ${MAINNET_LINK_VAULT_ADDRESS}
      PONDER_MONAD_TESTNET_VAULT: ${TESTNET_LINK_VAULT_ADDRESS:-}
      PONDER_RPC_MAINNET: https://monad-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}
      PONDER_RPC_TESTNET: https://testnet-rpc.monad.xyz
    volumes:
      - ./indexer/.ponder:/app/.ponder
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:42069/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - monlipay

  # ---------------------------------------------------------------
  # TESTNET — chain ID 10143
  # ---------------------------------------------------------------
  monlipay-testnet:
    container_name: monlipay-testnet
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_NETWORK: testnet
        NEXT_PUBLIC_LUCKY_VAULT_ADDRESS: ${TESTNET_LUCKY_VAULT_ADDRESS:-0x0000000000000000000000000000000000000000}
        NEXT_PUBLIC_GROUP_VAULT_ADDRESS: ${TESTNET_GROUP_VAULT_ADDRESS:-0x0000000000000000000000000000000000000000}
        NEXT_PUBLIC_LINK_VAULT_ADDRESS: ${TESTNET_LINK_VAULT_ADDRESS}
        NEXT_PUBLIC_WC_PROJECT_ID: ${NEXT_PUBLIC_WC_PROJECT_ID}
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID:-}
        NEXT_PUBLIC_GAS_SPONSOR_ENABLED: ${NEXT_PUBLIC_GAS_SPONSOR_ENABLED:-false}
        NEXT_PUBLIC_GAS_FORWARDER_ADDRESS: ${NEXT_PUBLIC_GAS_FORWARDER_ADDRESS:-}
    ports:
      - "0.0.0.0:3100:3000"
    restart: unless-stopped
    depends_on:
      - indexer
    environment:
      LIFI_API_KEY: ${LIFI_API_KEY:-}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      ENVIO_API_TOKEN: ${ENVIO_API_TOKEN:-}
      GAS_SPONSOR_PRIVATE_KEY: ${GAS_SPONSOR_PRIVATE_KEY:-}
      GAS_SPONSOR_DAILY_BUDGET_MON: ${GAS_SPONSOR_DAILY_BUDGET_MON:-5}
      INDEXER_INTERNAL_URL: http://indexer:42069
      CONTACTS_DB_PATH: /app/data/contacts.sqlite
      APP_ORIGIN: ${TESTNET_APP_ORIGIN:-https://testnet.monlipay.xyz}
    volumes:
      - testnet-contacts:/app/data
      - ./public-artifacts:/app/public/submission:ro
    networks:
      - monlipay

  # ---------------------------------------------------------------
  # MAINNET — chain ID 143
  # ---------------------------------------------------------------
  monlipay-mainnet:
    container_name: monlipay-mainnet
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_NETWORK: mainnet
        NEXT_PUBLIC_LUCKY_VAULT_ADDRESS: ${MAINNET_LUCKY_VAULT_ADDRESS:-0x0000000000000000000000000000000000000000}
        NEXT_PUBLIC_GROUP_VAULT_ADDRESS: ${MAINNET_GROUP_VAULT_ADDRESS:-0x0000000000000000000000000000000000000000}
        NEXT_PUBLIC_LINK_VAULT_ADDRESS: ${MAINNET_LINK_VAULT_ADDRESS}
        NEXT_PUBLIC_WC_PROJECT_ID: ${NEXT_PUBLIC_WC_PROJECT_ID}
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID:-}
        NEXT_PUBLIC_GAS_SPONSOR_ENABLED: ${NEXT_PUBLIC_GAS_SPONSOR_ENABLED:-false}
        NEXT_PUBLIC_GAS_FORWARDER_ADDRESS: ${NEXT_PUBLIC_GAS_FORWARDER_ADDRESS:-}
    ports:
      - "0.0.0.0:4100:3000"
    restart: unless-stopped
    depends_on:
      - indexer
    environment:
      LIFI_API_KEY: ${LIFI_API_KEY:-}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      ENVIO_API_TOKEN: ${ENVIO_API_TOKEN:-}
      GAS_SPONSOR_PRIVATE_KEY: ${GAS_SPONSOR_PRIVATE_KEY:-}
      GAS_SPONSOR_DAILY_BUDGET_MON: ${GAS_SPONSOR_DAILY_BUDGET_MON:-5}
      INDEXER_INTERNAL_URL: http://indexer:42069
      CONTACTS_DB_PATH: /app/data/contacts.sqlite
      APP_ORIGIN: ${MAINNET_APP_ORIGIN:-https://monlipay.xyz}
    volumes:
      - mainnet-contacts:/app/data
      - ./public-artifacts:/app/public/submission:ro
    networks:
      - monlipay

networks:
  monlipay:
    driver: bridge

volumes:
  testnet-contacts:
  mainnet-contacts:
