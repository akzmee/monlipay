# =============================================================================
# nginx — MonliPay reverse proxy config
# =============================================================================
#
# Routes two domains to two local docker containers:
#
#   testnet.monlipay.xyz  → 127.0.0.1:3000  (monlipay-testnet container)
#   monlipay.xyz          → 127.0.0.1:4000  (monlipay-mainnet container)
#   www.monlipay.xyz      → redirect to monlipay.xyz
#
# Setup (run as root / sudo):
#
#   1. Install nginx + certbot:
#        apt install -y nginx certbot python3-certbot-nginx
#
#   2. Symlink this file into nginx config:
#        cp deploy/nginx/monlipay.conf /etc/nginx/sites-available/monlipay
#        ln -s /etc/nginx/sites-available/monlipay /etc/nginx/sites-enabled/
#
#   3. Test config + reload:
#        nginx -t && systemctl reload nginx
#
#   4. Get SSL certificates (Let's Encrypt, free):
#        certbot --nginx -d monlipay.xyz -d www.monlipay.xyz -d testnet.monlipay.xyz
#      certbot will auto-edit this file to add the SSL block + 301 redirect
#      from http: to https:.
#
# After that, https:// is automatic and renewals are handled by certbot's
# systemd timer.
# =============================================================================

# Rate limit zone: 10 requests/sec per IP, burst-friendly.
# Protects the /api/bridge/* endpoints from abuse (the bridge API keys
# cost real money per call).
limit_req_zone $binary_remote_addr zone=monlipay_api:10m rate=10r/s;

# -----------------------------------------------------------------------------
# MAINNET — monlipay.xyz + www
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name monlipay.xyz www.monlipay.xyz;

    # www → apex redirect (one canonical URL)
    if ($host = www.monlipay.xyz) {
        return 301 https://$host$request_uri;
    }

    # Client max body size — Next.js API routes can receive bridge quote
    # payloads. 1MB is plenty.
    client_max_body_size 1m;

    # Reverse proxy to the mainnet container.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Next.js standalone server doesn't need long timeouts, but the
        # bridge API can take a few seconds (LI.FI round-trip).
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Rate-limit the bridge API specifically.
    location /api/bridge/ {
        limit_req zone=monlipay_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -----------------------------------------------------------------------------
# TESTNET — testnet.monlipay.xyz
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name testnet.monlipay.xyz;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/bridge/ {
        limit_req zone=monlipay_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
